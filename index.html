<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HTMLビューア</title>

    <!-- iOS PWA設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HTMLビューア">
    <link rel="apple-touch-icon" id="dynamic-favicon">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
            padding: 8px;
            gap: 8px;
            font-family: "MS PMincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
        }

        /* ---------------- 左側：16:9 描画ディスプレイ ---------------- */
        .display-area {
            flex-shrink: 0;
            height: calc(100vh - 16px);
            aspect-ratio: 16 / 9;
            background-color: #ffffff;
            position: relative;
            overflow: hidden;
            border: 2px solid #000080; /* 濃紺枠 */
        }

        /* ドロップ領域（未読込時） */
        #drop-zone {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #f4f6fa;
            color: #000080;
            cursor: pointer;
            text-align: center;
            padding: 20px;
        }
        #drop-zone.dragover {
            background-color: #d8e2f3;
        }
        #drop-zone h2 {
            font-size: 16px;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        #drop-zone p {
            font-size: 11px;
            color: #444;
        }

        /* 読み込んだHTMLを描画するフレーム */
        #render-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: none;
            background-color: #ffffff;
        }

        /* ---------------- PCカーソル（クラシック矢印） ---------------- */
        #virtual-cursor {
            position: absolute;
            width: 16px;
            height: 22px;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 99999;
            transform: translate(0, 0);
        }

        /* ---------------- 右側：タッチパッド ---------------- */
        .touchpad-area {
            flex-grow: 1;
            height: calc(100vh - 16px);
            background-color: #0a0a14;
            border: 1.5px solid #000080;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            touch-action: none;
        }
        .touchpad-label {
            color: #5d6d8c;
            font-size: 11px;
            letter-spacing: 2px;
            pointer-events: none;
        }

        #file-input {
            display: none;
        }
    </style>
</head>
<body>

    <!-- 非表示のファイル選択入力 -->
    <input type="file" id="file-input" accept=".html,.htm,text/html">

    <!-- 左側：16:9 描画ディスプレイ -->
    <div class="display-area" id="displayArea">
        <!-- マウスカーソル -->
        <div id="virtual-cursor">
            <svg width="16" height="22" viewBox="0 0 16 22" fill="none">
                <path d="M1 1V19L5.5 14.5L9 21L11.5 20L8 13.5H14L1 1Z" fill="#FFFFFF" stroke="#000000" stroke-width="1.6" stroke-linejoin="round"/>
            </svg>
        </div>

        <!-- ファイル未選択時のドロップ案内 -->
        <div id="drop-zone" onclick="document.getElementById('file-input').click()">
            <h2>HTML ファイルを描画</h2>
            <p>ここをタップして選択<br>またはファイルをドロップ</p>
        </div>

        <!-- 読み込んだHTMLを表示するiframe -->
        <iframe id="render-frame" sandbox="allow-scripts allow-same-origin"></iframe>
    </div>

    <!-- 右側：タッチパッド -->
    <div class="touchpad-area" id="touchpad">
        <div class="touchpad-label">TRACKPAD</div>
    </div>

    <script>
        // ---------------- PWAアイコン自動生成 ----------------
        (function generateIcon() {
            const canvas = document.createElement('canvas');
            canvas.width = 192; canvas.height = 192;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#000080';
            ctx.fillRect(0, 0, 192, 192);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 32px "MS PMincho", serif';
            ctx.textAlign = 'center';
            ctx.fillText('HTML', 96, 110);
            document.getElementById('dynamic-favicon').href = canvas.toDataURL('image/png');
        })();

        // ---------------- HTML読み込み＆描画機能 ----------------
        const fileInput = document.getElementById('file-input');
        const dropZone = document.getElementById('drop-zone');
        const renderFrame = document.getElementById('render-frame');

        function loadHTML(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                // iframe内にHTMLを流し込んで描画
                renderFrame.srcdoc = e.target.result;
                dropZone.style.display = 'none';
                renderFrame.style.display = 'block';
            };
            reader.readAsText(file);
        }

        fileInput.addEventListener('change', (e) => loadHTML(e.target.files[0]));

        // ドラッグ＆ドロップ対応
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                loadHTML(e.dataTransfer.files[0]);
            }
        });

        // ---------------- トラックパッド＆カーソル操作 ----------------
        const display = document.getElementById('displayArea');
        const cursor = document.getElementById('virtual-cursor');
        const touchpad = document.getElementById('touchpad');

        let cursorX = 40;
        let cursorY = 40;
        let lastTouchX = 0;
        let lastTouchY = 0;
        let isTouching = false;
        let touchStartTime = 0;
        let touchDist = 0;
        const SENSITIVITY = 1.35;

        function updateCursor() {
            const b = display.getBoundingClientRect();
            cursorX = Math.max(0, Math.min(b.width - 2, cursorX));
            cursorY = Math.max(0, Math.min(b.height - 2, cursorY));
            cursor.style.transform = `translate(${cursorX}px, ${cursorY}px)`;
        }

        touchpad.addEventListener('touchstart', (e) => {
            const t = e.touches[0];
            lastTouchX = t.clientX;
            lastTouchY = t.clientY;
            isTouching = true;
            touchStartTime = Date.now();
            touchDist = 0;
        }, { passive: false });

        touchpad.addEventListener('touchmove', (e) => {
            if (!isTouching) return;
            const t = e.touches[0];
            const dx = (t.clientX - lastTouchX) * SENSITIVITY;
            const dy = (t.clientY - lastTouchY) * SENSITIVITY;

            cursorX += dx;
            cursorY += dy;
            touchDist += Math.hypot(dx, dy);
            lastTouchX = t.clientX;
            lastTouchY = t.clientY;

            updateCursor();
        }, { passive: false });

        // パッドをタップしたときにカーソル直下の要素をクリック
        touchpad.addEventListener('touchend', () => {
            isTouching = false;
            if (Date.now() - touchStartTime < 250 && touchDist < 6) {
                if (renderFrame.style.display === 'block' && renderFrame.contentDocument) {
                    // 描画されたHTML内の要素をクリック
                    const el = renderFrame.contentDocument.elementFromPoint(cursorX, cursorY);
                    if (el) el.click();
                } else {
                    // まだファイル未選択ならファイル選択ダイアログを開く
                    fileInput.click();
                }
            }
        });

        window.addEventListener('load', updateCursor);
    </script>
</body>
</html>
